# Production Nginx config, per docs/architecture/adr/0002-single-docker-image-with-nginx.md.
# Serves the built flgr-web-client static assets and reverse-proxies /api/*
# to flgr-server, running as a sibling process in the same container
# (see supervisord.conf). Same-origin by construction, which is what
# docs/architecture/adr/0006-authentication-and-session-strategy.md relies on
# for the session cookie.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
