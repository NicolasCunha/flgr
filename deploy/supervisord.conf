; Runs Nginx and the flgr-server binary as sibling processes in the same
; container, per docs/architecture/adr/0002-single-docker-image-with-nginx.md.

[supervisord]
nodaemon=true

[program:flgr-server]
command=/usr/local/bin/flgr-server
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
