# Local development environment, per docs/architecture/adr/0012-local-development-environment.md.
# Not how flgr is deployed to production — see docs/architecture/adr/0002-single-docker-image-with-nginx.md.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: flgr-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flgr-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  flgr-server:
    build:
      context: ./flgr-server
      dockerfile: Dockerfile.dev
    container_name: flgr-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FLGR_KAFKA_BROKERS: kafka:9092
    volumes:
      - ./flgr-server:/app
      - flgr-server-modcache:/go/pkg/mod
    depends_on:
      - kafka

  flgr-web-client:
    build:
      context: ./flgr-web-client
      dockerfile: Dockerfile.dev
    container_name: flgr-web-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://flgr-server:8080
    volumes:
      - ./flgr-web-client:/app
      - flgr-web-client-node-modules:/app/node_modules
    depends_on:
      - flgr-server

volumes:
  flgr-server-modcache:
  flgr-web-client-node-modules:
