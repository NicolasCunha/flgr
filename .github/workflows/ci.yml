name: CI

# Gates per docs/architecture/adr/0011-ci-cd-pipeline.md: lint, test with a
# coverage threshold, and build, for both projects, plus a Docker build
# validation (no push — see publish.yml for that).

on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flgr-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: flgr-server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: flgr-server
          version: v2.12

      - name: Test with coverage
        run: go test $(go list ./... | grep -v /cmd/) -coverprofile=coverage.out -covermode=atomic

      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage (excluding cmd/server): ${total}%"
          # docs/architecture/adr/0004-testing-and-coverage-standards.md targets 100%.
          # The threshold here is 98, not 100, for one documented exception:
          # internal/database/database.go's Open() has a branch (a successful
          # Ping immediately followed by a failing PRAGMA) that isn't reachable
          # without a fault-injecting driver double — see the comment on that
          # line. cmd/server (main.go, thin wiring) is excluded from the "go
          # test" invocation above entirely, per its own doc comment.
          awk -v total="$total" 'BEGIN { exit (total + 0 < 98) }'

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flgr-web-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: flgr-web-client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      # Coverage thresholds (100%) are enforced by vite.config.ts's own
      # `test.coverage.thresholds`, per docs/architecture/adr/0004.
      - run: npx vitest run --coverage
      - run: npm run build

  docker-build:
    name: Docker image build (validate only)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
